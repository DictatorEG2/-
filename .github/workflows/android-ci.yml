name: Android CI

on:
  push:
    branches: [ main, master ]
    paths:
      - "SAWT-Android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [ main, master ]
    paths:
      - "SAWT-Android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Static checks, unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project structure
        working-directory: SAWT-Android
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Run JVM unit tests
        working-directory: SAWT-Android
        run: gradle testDebugUnitTest

      - name: Run Android lint
        working-directory: SAWT-Android
        run: gradle lintDebug

      - name: Assemble debug APK
        working-directory: SAWT-Android
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sawt-debug-apk
          path: SAWT-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
