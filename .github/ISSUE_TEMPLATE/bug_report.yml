name: الإبلاغ عن خطأ
description: بلّغ عن مشكلة قابلة لإعادة الإنتاج
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: وصف المشكلة
      description: اشرح ما حدث وما الذي توقعت حدوثه.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: خطوات إعادة المشكلة
      placeholder: |
        1. افتح ...
        2. اضغط ...
        3. لاحظ ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: الجهاز/النظام/إصدار التطبيق
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: سجل منقح (اختياري)
      description: احذف كلمات المرور والرموز والبيانات الشخصية قبل الإرسال.
    validations:
      required: false
